services:
  pgsql:
    image: postgres:17-alpine
    container_name: dalilukum-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: dalilukum
      POSTGRES_USER: dalilukum
      POSTGRES_PASSWORD: dalilukum
    ports:
      - "5432:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalilukum -d dalilukum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgsql_data:
